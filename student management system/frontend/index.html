<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .form-box h2,
        .table-box h2 {
            margin-bottom: 15px;
            color: #1e3a8a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 5px;
        }

        .add-btn {
            background: #1e3a8a;
            color: white;
        }

        .clear-btn {
            background: #6b7280;
            color: white;
        }

        .search {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 7px;
            }

            button {
                margin-bottom: 5px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Student Management System</h1>
        <p>CRUD Based Web Application</p>
    </header>

    <div class="form-box">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-group">
                <label>Student Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="ECE">ECE</option>
                    <option value="CSE">CSE</option>
                    <option value="IT">IT</option>
                    <option value="EEE">EEE</option>
                    <option value="MECH">MECH</option>
                </select>
            </div>

            <div class="form-group">
                <label>Year</label>
                <select id="year" required>
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <button type="submit" class="add-btn">
                Save Student
            </button>

            <button type="button" class="clear-btn" onclick="clearForm()">
                Clear
            </button>

            <p id="message"></p>

        </form>

    </div>

    <div class="table-box">

        <h2>Student Records</h2>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="Search student..."
            onkeyup="searchStudents()"
        >

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

</div>
<script>
const API_URL = "http://127.0.0.1:8000/api/students/";

// Load students
async function loadStudents() {
    const response = await fetch(API_URL);
    const students = await response.json();

    const tbody = document.querySelector("#studentTable tbody");
    tbody.innerHTML = "";

    students.forEach(student => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.department}</td>
            <td>${student.year}</td>
            <td>
                <button onclick="editStudent(${student.id})">Edit</button>
                <button onclick="deleteStudent(${student.id})">Delete</button>
            </td>
        `;

        tbody.appendChild(row);
    });
}

// Add student
async function addStudent(event) {
    event.preventDefault();

    const student = {
        name: document.querySelector("#name").value,
        email: document.querySelector("#email").value,
        department: document.querySelector("#department").value,
        year: document.querySelector("#year").value
    };

    const response = await fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(student)
    });

    if (response.ok) {
        alert("Student added successfully!");
        document.querySelector("#studentForm").reset();
        loadStudents();
    } else {
        alert("Error adding student");
    }
}

// Delete student
async function deleteStudent(id) {
    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }

    const response = await fetch(API_URL + id + "/", {
        method: "DELETE"
    });

    if (response.ok) {
        alert("Student deleted successfully!");
        loadStudents();
    }
}

// Edit student
async function editStudent(id) {
    const response = await fetch(API_URL + id + "/");
    const student = await response.json();

    const name = prompt("Enter student name:", student.name);
    const email = prompt("Enter email:", student.email);
    const department = prompt("Enter department:", student.department);
    const year = prompt("Enter year:", student.year);

    if (name && email && department && year) {
        await fetch(API_URL + id + "/", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                department: department,
                year: year
            })
        });

        alert("Student updated successfully!");
        loadStudents();
    }
}

// Form submit
document.querySelector("#studentForm").addEventListener("submit", addStudent);

// Load data when page opens
loadStudents();
</script>


</body>
</html>
